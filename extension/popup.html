<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: dark; }
  body { width: 340px; margin: 0; font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#0f0f14; color:#e6e6f0; }
  header { padding: 14px 14px 8px; border-bottom:1px solid #23232e; }
  header h1 { margin:0; font-size:14px; font-weight:600; }
  header p { margin:4px 0 0; color:#8a8aa0; font-size:11px; }
  main { padding: 12px 14px 14px; display:flex; flex-direction:column; gap:10px; }
  label { font-size:11px; color:#a0a0b8; }
  textarea { width:100%; box-sizing:border-box; height:70px; resize:none; background:#17171f; color:#dcdcec; border:1px solid #2a2a38; border-radius:8px; padding:8px; font: 11px ui-monospace, Menlo, monospace; word-break:break-all; }
  input { width:100%; box-sizing:border-box; background:#17171f; color:#dcdcec; border:1px solid #2a2a38; border-radius:8px; padding:8px; font-size:12px; }
  .row { display:flex; gap:8px; }
  button { flex:1; padding:9px 10px; border-radius:8px; border:1px solid #2a2a38; background:#1f1f2b; color:#e6e6f0; cursor:pointer; font-size:12px; font-weight:500; }
  button.primary { background:linear-gradient(135deg,#7c3aed,#a855f7); border-color:transparent; color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { font-size:11px; min-height:14px; }
  .ok { color:#4ade80; } .err { color:#f87171; } .muted { color:#8a8aa0; }
  details { font-size:11px; color:#a0a0b8; }
  summary { cursor:pointer; padding:4px 0; }
</style>
</head>
<body>
<header>
  <h1>Leonardo Token Grabber</h1>
  <p>Login ke app.leonardo.ai, lalu klik "Ambil Token".</p>
</header>
<main>
  <div class="status muted" id="status">Siap.</div>
  <label>JWT Token</label>
  <textarea id="token" placeholder="Token akan muncul di sini..." readonly></textarea>
  <div class="row">
    <button id="grab" class="primary">Ambil Token</button>
    <button id="copy" disabled>Copy</button>
  </div>
  <details>
    <summary>Kirim ke AACreative</summary>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
      <label>URL App AACreative</label>
      <input id="appUrl" placeholder="https://aacreative.example.com" />
      <button id="send" disabled>Buka & Isi ke Account Manager</button>
    </div>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
